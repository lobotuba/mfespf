# Declared external data sources -- the record, not the bytes.
#
# `data/raw/` is git-ignored, so a checkout fetches its own copies with
# tools/fetch_data.py and verifies them against the checksums below. That keeps
# two things apart that are easy to conflate: the provenance of a dataset, which
# belongs under version control because a result is not reproducible without it,
# and the dataset itself, whose redistribution terms belong to whoever produced
# it. See data/README.md for the reasoning and the licence position.
#
# `provenance_class` is the framework's own classification (INF-002), not the
# provider's. It says what kind of thing the record is, and the dataset registry
# refuses an undeclared one in any evidence role.
#
# Edited by tools/fetch_data.py, which rewrites only the sha256 and retrieved
# lines and leaves everything else -- including this header -- alone.

version: 1
retrieved_with: tools/fetch_data.py
