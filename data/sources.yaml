# --- not fetchable without credentials --------------------------------------
#
# CERES EBAF is the single most valuable dataset for this framework: it reports
# top-of-atmosphere longwave and shortwave, all-sky and clear-sky separately,
# which is exactly how Stage 4 publishes them. It is absent because it needs a
# NASA Earthdata login and the CERES ordering tool. To add it: order EBAF-TOA
# monthly global means, put the file in data/raw/, add an entry above, and run
# tools/fetch_data.py --update.
#
# Absent for the same reason: the CMIP6 solar and volcanic forcing datasets on
# input4MIPs (ESGF authentication) and HITRAN line parameters (registration).
