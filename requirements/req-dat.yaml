requirements:
- id: DAT-001
  text: Every exchanged field SHALL include a unique field_id, physical name, units, data type, dimensions,
    coordinates, spatial support, timestamp or interval, sign convention, provenance, and quality flags.
  strength: mandatory
  section: COMMON FIELD AND DATA REQUIREMENTS
  verification: TEST
  status: not_started
